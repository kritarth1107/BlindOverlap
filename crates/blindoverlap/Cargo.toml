[package]
name = "blindoverlap"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Agent-native private set intersection (PSI) over content-addressed fact IDs"
keywords = ["psi", "privacy", "cryptography", "set-intersection"]
categories = ["cryptography"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
x25519-dalek = { workspace = true, features = ["static_secrets"] }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand = { workspace = true }
rand_core = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
tokio = { workspace = true }

[[example]]
name = "basic_psi"
path = "../../examples/basic_psi.rs"

[[example]]
name = "http_psi_demo"
path = "../../examples/http_psi_demo.rs"
