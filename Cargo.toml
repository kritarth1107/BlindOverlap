[workspace]
resolver = "2"
members = ["crates/blindoverlap", "crates/blindoverlap-cli"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
authors = ["Kritarth Agrawal <singhalkritarth@gmail.com>"]
repository = "https://github.com/kritarth1107/BlindOverlap"

[workspace.dependencies]
blindoverlap = { path = "crates/blindoverlap" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
hmac = "0.12"
x25519-dalek = "2.0.0"
ed25519-dalek = "2.1.0"
rand = "0.8.5"
rand_core = "0.6"
thiserror = "1.0"
clap = { version = "4.5.0", features = ["derive"] }
hex = "0.4"
base64 = "0.21"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "net", "io-util"] }
